<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🩺 Diabetes Risk AI Assessment — Web Client</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"] {
    --bg: #090D16;
    --card-bg: rgba(30, 41, 59, 0.75);
    --card-border: rgba(51, 65, 85, 0.6);
    --input-bg: #0F172A;
    --input-border: #334155;
    --primary: #0EA5E9;
    --primary-hover: #0284C7;
    --accent: #38BDF8;
    --text: #F8FAFC;
    --muted: #94A3B8;
    --danger: #EF4444;
    --danger-bg: rgba(239, 68, 68, 0.15);
    --safe: #10B981;
    --safe-bg: rgba(16, 185, 129, 0.15);
    --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
  }
  :root[data-theme="light"] {
    --bg: #F8FAFC;
    --card-bg: #FFFFFF;
    --card-border: #E2E8F0;
    --input-bg: #F1F5F9;
    --input-border: #CBD5E1;
    --primary: #0284C7;
    --primary-hover: #0369A1;
    --accent: #0EA5E9;
    --text: #0F172A;
    --muted: #64748B;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --safe: #059669;
    --safe-bg: #ECFDF5;
    --shadow: 0 10px 30px -10px rgba(14, 165, 233, 0.12);
  }
  
  * { box-sizing: border-box; transition: background-color 0.25s, border-color 0.25s, color 0.25s; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 32px 16px;
    min-height: 100vh;
  }
  .container { max-width: 1040px; margin: 0 auto; }
  
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--card-border);
    flex-wrap: wrap;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-icon {
    width: 48px; height: 48px;
    background: rgba(14, 165, 233, 0.15);
    border: 1px solid rgba(14, 165, 233, 0.3);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  h1 { font-size: 1.55rem; margin: 0; font-weight: 800; }
  .subtitle { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
  
  .controls-group { display: flex; gap: 10px; }
  .control-btn {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.85rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  }
  .control-btn:hover { border-color: var(--primary); color: var(--primary); }

  .server-bar {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    border-radius: 14px;
    padding: 14px 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: var(--shadow);
  }
  .server-bar label { font-size: 0.85rem; font-weight: 700; color: var(--primary); white-space: nowrap; }
  .server-bar input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.9rem;
  }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 840px) { .grid { grid-template-columns: 1fr; } }
  
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(12px);
    border-radius: 18px;
    padding: 24px;
    box-shadow: var(--shadow);
  }
  .section-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
  }
  
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-control {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--input-border);
    background: var(--input-bg);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
  }
  .form-control:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2);
  }
  
  /* Segmented pills */
  .segmented-group {
    display: flex;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 10px;
    padding: 3px;
    gap: 4px;
  }
  .segmented-group input[type="radio"] { display: none; }
  .segmented-group label {
    flex: 1;
    text-align: center;
    padding: 8px 12px;
    margin: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--muted);
  }
  .segmented-group input[type="radio"]:checked + label {
    background: var(--primary);
    color: #FFF;
    box-shadow: 0 2px 8px rgba(14, 165, 233, 0.4);
  }

  .bmi-badge {
    font-size: 0.75rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 700;
  }
  
  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 10px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), #2563EB);
    color: #FFF;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(14, 165, 233, 0.45); }
  
  .result-card {
    min-height: 280px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    border-radius: 14px;
    padding: 24px;
  }
  .result-card.placeholder { background: var(--input-bg); border: 2px dashed var(--input-border); }
  .result-card.risk { background: var(--danger-bg); border: 1.5px solid var(--danger); }
  .result-card.safe { background: var(--safe-bg); border: 1.5px solid var(--safe); }
  
  .result-title { font-size: 1.6rem; font-weight: 800; margin: 12px 0 6px; }
  .result-card.risk .result-title { color: var(--danger); }
  .result-card.safe .result-title { color: var(--safe); }
  
  .confidence-box { width: 100%; margin-top: 16px; text-align: left; }
  .confidence-header { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 6px; color: var(--muted); }
  .progress-bg { width: 100%; height: 10px; background: rgba(0,0,0,0.1); border-radius: 10px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 10px; transition: width 0.6s ease; }
  
  pre {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    padding: 12px;
    border-radius: 10px;
    overflow-x: auto;
    font-size: 0.78rem;
    color: var(--primary);
    max-height: 180px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand">
      <div class="brand-icon">🩺</div>
      <div>
        <h1>Diabetes Risk AI</h1>
        <div class="subtitle" id="i18n-sub">Đánh giá & Dự đoán nguy cơ mắc bệnh tiểu đường — Web Client (FastAPI)</div>
      </div>
    </div>

    <div class="controls-group">
      <!-- Theme Switcher Button -->
      <button class="control-btn" id="themeBtn" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span> <span id="themeText">Tối</span>
      </button>

      <!-- Language Selector Button -->
      <button class="control-btn" id="langBtn" onclick="toggleLang()">
        <span>🌐</span> <span id="langText">EN</span>
      </button>
    </div>
  </header>

  <div class="server-bar">
    <label id="i18n-server-lbl">🌐 API Base URL:</label>
    <input id="apiUrl" value="https://diabetes-api-q1ke.onrender.com" placeholder="https://diabetes-api-q1ke.onrender.com" />
  </div>

  <div class="grid">
    <!-- Form Card -->
    <div class="card">
      <form id="diabetesForm">
        <div class="section-title" id="i18n-sec1">👤 1. Thông tin cá nhân</div>
        
        <div class="form-group">
          <label id="i18n-lbl-gender">Giới tính</label>
          <div class="segmented-group">
            <input type="radio" id="gFemale" name="gender" value="Female" checked>
            <label for="gFemale" id="i18n-opt-female">👩 Nữ</label>
            <input type="radio" id="gMale" name="gender" value="Male">
            <label for="gMale" id="i18n-opt-male">👨 Nam</label>
            <input type="radio" id="gOther" name="gender" value="Other">
            <label for="gOther" id="i18n-opt-other">✨ Khác</label>
          </div>
        </div>

        <div class="form-group">
          <label for="age" id="i18n-lbl-age">Tuổi</label>
          <input type="number" id="age" class="form-control" value="45" min="1" max="120" required>
        </div>

        <div class="section-title" style="margin-top:24px;" id="i18n-sec2">🏥 2. Tiền sử Y tế & Thói quen</div>
        
        <div class="form-group">
          <label id="i18n-lbl-hyp">Tăng huyết áp (Hypertension)</label>
          <div class="segmented-group">
            <input type="radio" id="hyp0" name="hypertension" value="0" checked>
            <label for="hyp0" id="i18n-opt-hyp0">Không</label>
            <input type="radio" id="hyp1" name="hypertension" value="1">
            <label for="hyp1" id="i18n-opt-hyp1">Có</label>
          </div>
        </div>

        <div class="form-group">
          <label id="i18n-lbl-hd">Bệnh tim mạch (Heart Disease)</label>
          <div class="segmented-group">
            <input type="radio" id="hd0" name="heart_disease" value="0" checked>
            <label for="hd0" id="i18n-opt-hd0">Không</label>
            <input type="radio" id="hd1" name="heart_disease" value="1">
            <label for="hd1" id="i18n-opt-hd1">Có</label>
          </div>
        </div>

        <div class="form-group">
          <label for="smoking_history" id="i18n-lbl-smoking">Tiền sử hút thuốc</label>
          <select id="smoking_history" class="form-control">
            <option value="never" selected>never (Chưa từng)</option>
            <option value="No Info">No Info (Không có dữ liệu)</option>
            <option value="current">current (Đang hút)</option>
            <option value="former">former (Đã từng)</option>
            <option value="ever">ever (Thỉnh thoảng)</option>
            <option value="not current">not current (Hiện không hút)</option>
          </select>
        </div>

        <div class="section-title" style="margin-top:24px;" id="i18n-sec3">📊 3. Chỉ số Sinh hiệu & Xét nghiệm</div>
        
        <div class="form-group">
          <label for="bmi">
            <span id="i18n-lbl-bmi">Chỉ số BMI (kg/m²)</span>
            <span id="bmiBadge" class="bmi-badge"></span>
          </label>
          <input type="number" step="0.1" id="bmi" class="form-control" value="24.5" required>
        </div>

        <div class="form-group">
          <label for="HbA1c_level" id="i18n-lbl-hba1c">HbA1c level (%) (Bình thường < 5.7)</label>
          <input type="number" step="0.1" id="HbA1c_level" class="form-control" value="5.7" required>
        </div>

        <div class="form-group">
          <label for="blood_glucose_level" id="i18n-lbl-glucose">Đường huyết lúc đói (mg/dL) (Bình thường < 140)</label>
          <input type="number" id="blood_glucose_level" class="form-control" value="120" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
          ⚡ Phân Tích Nguy Cơ AI
        </button>
      </form>
    </div>

    <!-- Output Card -->
    <div>
      <div class="card">
        <div class="section-title" id="i18n-sec-res">📋 Kết quả Dự đoán AI</div>
        <div id="resultContainer" class="result-card placeholder">
          <div style="font-size: 40px; margin-bottom: 10px;">🩺</div>
          <p style="color:var(--muted); margin:0;" id="i18n-placeholder-msg">Nhập thông tin bệnh nhân và bấm nút <strong>Phân Tích Nguy Cơ AI</strong> để xem kết quả.</p>
        </div>

        <h4 style="margin-top:24px; margin-bottom:8px; font-size:0.85rem; color:var(--muted);">Raw JSON Response:</h4>
        <pre id="rawResponse">—</pre>
      </div>
    </div>
  </div>
</div>

<script>
let currentLang = 'vi';
let isDarkMode = true;

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDarkMode ? '🌙' : '☀️';
  document.getElementById('themeText').textContent = isDarkMode ? (currentLang === 'vi' ? 'Tối' : 'Dark') : (currentLang === 'vi' ? 'Sáng' : 'Light');
}

const i18n = {
  vi: {
    sub: "Đánh giá & Dự đoán nguy cơ mắc bệnh tiểu đường — Web Client (FastAPI)",
    serverLbl: "🌐 API Base URL:",
    sec1: "👤 1. Thông tin cá nhân",
    gender: "Giới tính",
    female: "👩 Nữ", male: "👨 Nam", other: "✨ Khác",
    age: "Tuổi",
    sec2: "🏥 2. Tiền sử Y tế & Thói quen",
    hyp: "Tăng huyết áp (Hypertension)",
    hd: "Bệnh tim mạch (Heart Disease)",
    hyp0: "Không", hyp1: "Có",
    hd0: "Không", hd1: "Có",
    smoking: "Tiền sử hút thuốc",
    sec3: "📊 3. Chỉ số Sinh hiệu & Xét nghiệm",
    bmi: "Chỉ số BMI (kg/m²)",
    hba1c: "HbA1c level (%) (Bình thường < 5.7)",
    glucose: "Đường huyết lúc đói (mg/dL) (Bình thường < 140)",
    submitBtn: "⚡ Phân Tích Nguy Cơ AI",
    secRes: "📋 Kết quả Dự đoán AI",
    placeholderMsg: "Nhập thông tin bệnh nhân và bấm nút <strong>Phân Tích Nguy Cơ AI</strong> để xem kết quả.",
    underweight: "Gầy (< 18.5)", normal: "Bình thường (18.5 - 24.9)", overweight: "Thừa cân (25 - 29.9)", obese: "Béo phì (≥ 30)"
  },
  en: {
    sub: "Diabetes Risk Assessment & AI Prediction — Web Client (FastAPI)",
    serverLbl: "🌐 API Base URL:",
    sec1: "👤 1. Personal Information",
    gender: "Gender",
    female: "👩 Female", male: "👨 Male", other: "✨ Other",
    age: "Age",
    sec2: "🏥 2. Medical History & Habits",
    hyp: "Hypertension",
    hd: "Heart Disease",
    hyp0: "No", hyp1: "Yes",
    hd0: "No", hd1: "Yes",
    smoking: "Smoking History",
    sec3: "📊 3. Biomarkers & Body Metrics",
    bmi: "BMI Index (kg/m²)",
    hba1c: "HbA1c level (%) (Normal < 5.7)",
    glucose: "Fasting Blood Glucose (mg/dL) (Normal < 140)",
    submitBtn: "⚡ Analyze Risk with AI",
    secRes: "📋 AI Prediction Result",
    placeholderMsg: "Fill patient information and click <strong>Analyze Risk with AI</strong> to view results.",
    underweight: "Underweight (< 18.5)", normal: "Normal (18.5 - 24.9)", overweight: "Overweight (25 - 29.9)", obese: "Obese (≥ 30)"
  }
};

function toggleLang() {
  currentLang = currentLang === 'vi' ? 'en' : 'vi';
  document.getElementById('langText').textContent = currentLang === 'vi' ? 'EN' : 'VI';
  document.getElementById('themeText').textContent = isDarkMode ? (currentLang === 'vi' ? 'Tối' : 'Dark') : (currentLang === 'vi' ? 'Sáng' : 'Light');
  applyTranslations();
}

function applyTranslations() {
  const t = i18n[currentLang];
  document.getElementById('i18n-sub').textContent = t.sub;
  document.getElementById('i18n-server-lbl').textContent = t.serverLbl;
  document.getElementById('i18n-sec1').textContent = t.sec1;
  document.getElementById('i18n-lbl-gender').textContent = t.gender;
  document.getElementById('i18n-opt-female').textContent = t.female;
  document.getElementById('i18n-opt-male').textContent = t.male;
  document.getElementById('i18n-opt-other').textContent = t.other;
  document.getElementById('i18n-lbl-age').textContent = t.age;
  document.getElementById('i18n-sec2').textContent = t.sec2;
  document.getElementById('i18n-lbl-hyp').textContent = t.hyp;
  document.getElementById('i18n-opt-hyp0').textContent = t.hyp0;
  document.getElementById('i18n-opt-hyp1').textContent = t.hyp1;
  document.getElementById('i18n-lbl-hd').textContent = t.hd;
  document.getElementById('i18n-opt-hd0').textContent = t.hd0;
  document.getElementById('i18n-opt-hd1').textContent = t.hd1;
  document.getElementById('i18n-lbl-smoking').textContent = t.smoking;
  document.getElementById('i18n-sec3').textContent = t.sec3;
  document.getElementById('i18n-lbl-bmi').textContent = t.bmi;
  document.getElementById('i18n-lbl-hba1c').textContent = t.hba1c;
  document.getElementById('i18n-lbl-glucose').textContent = t.glucose;
  document.getElementById('submitBtn').innerHTML = t.submitBtn;
  document.getElementById('i18n-sec-res').textContent = t.secRes;
  
  const ph = document.getElementById('i18n-placeholder-msg');
  if (ph) ph.innerHTML = t.placeholderMsg;
  updateBmiBadge();
}

const bmiInput = document.getElementById('bmi');
const bmiBadge = document.getElementById('bmiBadge');

function updateBmiBadge() {
  const t = i18n[currentLang];
  const val = parseFloat(bmiInput.value) || 0;
  if (val <= 0) { bmiBadge.textContent = ''; return; }
  if (val < 18.5) {
    bmiBadge.textContent = t.underweight;
    bmiBadge.style.background = '#0EA5E9'; bmiBadge.style.color = '#FFF';
  } else if (val < 24.9) {
    bmiBadge.textContent = t.normal;
    bmiBadge.style.background = '#10B981'; bmiBadge.style.color = '#FFF';
  } else if (val < 29.9) {
    bmiBadge.textContent = t.overweight;
    bmiBadge.style.background = '#F59E0B'; bmiBadge.style.color = '#000';
  } else {
    bmiBadge.textContent = t.obese;
    bmiBadge.style.background = '#EF4444'; bmiBadge.style.color = '#FFF';
  }
}
bmiInput.addEventListener('input', updateBmiBadge);

document.getElementById('diabetesForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const base = document.getElementById('apiUrl').value.trim().replace(/\/+$/, '');
  const submitBtn = document.getElementById('submitBtn');
  const resContainer = document.getElementById('resultContainer');
  const rawEl = document.getElementById('rawResponse');

  const payload = {
    gender: document.querySelector('input[name="gender"]:checked').value,
    age: parseFloat(document.getElementById('age').value),
    hypertension: parseInt(document.querySelector('input[name="hypertension"]:checked').value),
    heart_disease: parseInt(document.querySelector('input[name="heart_disease"]:checked').value),
    smoking_history: document.getElementById('smoking_history').value,
    bmi: parseFloat(document.getElementById('bmi').value),
    HbA1c_level: parseFloat(document.getElementById('HbA1c_level').value),
    blood_glucose_level: parseFloat(document.getElementById('blood_glucose_level').value)
  };

  submitBtn.disabled = true;
  submitBtn.innerHTML = currentLang === 'vi' ? '⏳ Đang phân tích...' : '⏳ Analyzing...';
  resContainer.className = 'result-card placeholder';
  resContainer.innerHTML = '<p style="color:var(--accent)">Calling API...</p>';

  try {
    const res = await fetch(base + '/predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error('HTTP status ' + res.status);
    const data = await res.json();
    rawEl.textContent = JSON.stringify(data, null, 2);

    const isRisk = data.prediction_label === 1;
    const confidencePct = (data.confidence * 100).toFixed(1);

    const resTitle = currentLang === 'vi' 
      ? (data.prediction || (isRisk ? 'Có nguy cơ tiểu đường' : 'Không mắc tiểu đường'))
      : (isRisk ? 'High Diabetes Risk Detected' : 'No Diabetes Detected');

    resContainer.className = `result-card ${isRisk ? 'risk' : 'safe'}`;
    resContainer.innerHTML = `
      <div style="font-size: 48px;">${isRisk ? '⚠️' : '✅'}</div>
      <div class="result-title">${resTitle}</div>
      <div style="font-size: 0.9rem; color: var(--text);">${isRisk ? (currentLang === 'vi' ? 'Bệnh nhân nằm trong nhóm nguy cơ cao' : 'Patient belongs to high risk group') : (currentLang === 'vi' ? 'Bệnh nhân ở mức an toàn' : 'Patient metrics are safe')}</div>
      
      <div class="confidence-box">
        <div class="confidence-header">
          <span>${currentLang === 'vi' ? 'Độ tin cậy của AI:' : 'Model Confidence:'}</span>
          <strong>${confidencePct}%</strong>
        </div>
        <div class="progress-bg">
          <div class="progress-fill" style="width: ${confidencePct}%; background: ${isRisk ? '#EF4444' : '#10B981'};"></div>
        </div>
      </div>
      
      <div style="margin-top: 16px; font-size: 0.8rem; color: var(--muted);">
        ${isRisk 
          ? (currentLang === 'vi' ? 'Khuyến nghị: Nên đi khám xét nghiệm lâm sàng bổ sung và kiểm soát lượng đường trong máu.' : 'Recommendation: Consult a medical specialist for clinical laboratory testing.') 
          : (currentLang === 'vi' ? 'Khuyến nghị: Tiếp tục duy trì lối sống lành mạnh và theo dõi định kỳ.' : 'Recommendation: Maintain a healthy diet and conduct regular checkups.')}
      </div>
    `;
  } catch (err) {
    resContainer.className = 'result-card risk';
    resContainer.innerHTML = `<div style="font-size:36px;">❌</div><div class="result-title" style="font-size:1.2rem;">${currentLang === 'vi' ? 'Lỗi Kết Nối' : 'Connection Error'}</div><p style="color:var(--text); font-size:0.85rem;">Cannot connect to API at <code>${base}</code>.</p>`;
    rawEl.textContent = 'Lỗi: ' + err.message;
  } finally {
    submitBtn.disabled = false;
    submitBtn.innerHTML = i18n[currentLang].submitBtn;
  }
});
</script>
</body>
</html>
