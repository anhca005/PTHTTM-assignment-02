<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f172a" />
<link rel="manifest" href="manifest.json" />
<title>Diabetes Check — Mobile</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#34d399; --text:#e2e8f0; --muted:#94a3b8; --danger:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
  h1 { font-size: 1.2rem; margin-bottom: 2px; }
  .sub { color: var(--muted); margin-top:0; margin-bottom: 14px; font-size: .8rem; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { display:block; font-size:.78rem; color:var(--muted); margin: 10px 0 4px; }
  input, select { width:100%; padding:11px 10px; border-radius:8px; border:1px solid #334155; background:#0f172a; color:var(--text); font-size:1rem; }
  button { width:100%; margin-top:18px; padding:15px; border:none; border-radius:10px; background:var(--accent); color:#06281c; font-weight:700; font-size:1rem; }
  #result { text-align:center; font-size:1.1rem; font-weight:700; margin-top:4px; min-height:1.4em; }
  #result.risk { color: var(--danger); }
  #result.safe { color: var(--accent); }
  #apiRow { font-size:.72rem; color:var(--muted); margin-bottom:10px; }
  #apiRow input { font-size:.72rem; padding:6px; }
</style>
</head>
<body>

<h1>🩺 Diabetes Check</h1>
<p class="sub">Mobile client — sends your data to the prediction API and shows the result.</p>

<div id="apiRow">
  API: <input id="apiUrl" value="http://localhost:8000" />
</div>

<div class="card">
  <label>Gender</label>
  <select id="gender"><option>Female</option><option>Male</option><option>Other</option></select>

  <label>Age</label>
  <input id="age" type="number" value="45" />

  <label>Hypertension</label>
  <select id="hypertension"><option value="0">No</option><option value="1">Yes</option></select>

  <label>Heart disease</label>
  <select id="heart_disease"><option value="0">No</option><option value="1">Yes</option></select>

  <label>Smoking history</label>
  <select id="smoking_history">
    <option>never</option><option>No Info</option><option>current</option>
    <option>former</option><option>ever</option><option>not current</option>
  </select>

  <label>BMI</label>
  <input id="bmi" type="number" step="0.1" value="24.5" />

  <label>HbA1c level (%)</label>
  <input id="HbA1c_level" type="number" step="0.1" value="5.7" />

  <label>Blood glucose (mg/dL)</label>
  <input id="blood_glucose_level" type="number" value="120" />

  <button id="btn">Predict</button>
  <div id="result"></div>
</div>

<script>
document.getElementById("btn").addEventListener("click", async () => {
  const base = document.getElementById("apiUrl").value.replace(/\/$/, "");
  const resultEl = document.getElementById("result");
  resultEl.className = "";
  resultEl.textContent = "Calling API...";

  const payload = {
    gender: document.getElementById("gender").value,
    age: parseFloat(document.getElementById("age").value),
    hypertension: parseInt(document.getElementById("hypertension").value),
    heart_disease: parseInt(document.getElementById("heart_disease").value),
    smoking_history: document.getElementById("smoking_history").value,
    bmi: parseFloat(document.getElementById("bmi").value),
    HbA1c_level: parseFloat(document.getElementById("HbA1c_level").value),
    blood_glucose_level: parseFloat(document.getElementById("blood_glucose_level").value),
  };

  try {
    const res = await fetch(base + "/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    resultEl.textContent = data.prediction + " (" + (data.confidence*100).toFixed(1) + "%)";
    resultEl.className = data.prediction_label === 1 ? "risk" : "safe";
  } catch (err) {
    resultEl.textContent = "Error: " + err.message;
    resultEl.className = "risk";
  }
});
</script>
</body>
</html>
